<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">ReformANY — Watch the official product trailer</title>
<desc id="desc">Dark sage green trailer preview with clean typography, a play symbol, and abstract circular Orbit design.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111b15"/>
    <stop offset=".65" stop-color="#1b2b20"/>
    <stop offset="1" stop-color="#253c2b"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a8cba5" stop-opacity=".21"/>
    <stop offset="1" stop-color="#a8cba5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="play" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#d5e8d0"/>
    <stop offset="1" stop-color="#aecfac"/>
  </linearGradient>
</defs>
<rect width="1200" height="560" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="558" rx="19" fill="none" stroke="#445b48" stroke-opacity=".64" stroke-width="2"/>
<path d="M0 474H1200" stroke="#78947a" stroke-opacity=".26"/>
<circle cx="900" cy="240" r="345" fill="url(#glow)"/>
<circle cx="900" cy="240" r="235" fill="none" stroke="#aac9a7" stroke-opacity=".16" stroke-width="1.5"/>
<circle cx="900" cy="240" r="183" fill="none" stroke="#aac9a7" stroke-opacity=".26" stroke-width="1.5"/>
<circle cx="900" cy="240" r="127" fill="#1c2d21" stroke="#a1c6a0" stroke-opacity=".36" stroke-width="2"/>
<circle cx="900" cy="240" r="85" fill="url(#play)"/>
<path d="M883 206 L937 240 L883 274 Z" fill="#1c3221"/>
<circle cx="900" cy="240" r="166" fill="none" stroke="#abc9a9" stroke-opacity=".26" stroke-width="1" stroke-dasharray="3 14"/>
<rect x="55" y="51" width="8" height="8" rx="4" fill="#bddfba"/>
<text x="77" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#c9ddc6">REFORMANY</text>
<path d="M55 87H490" stroke="#8ea994" stroke-opacity=".27"/>
<text x="55" y="174" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="4" fill="#91ae95" font-weight="700">OFFICIAL PRODUCT TRAILER</text>
<text x="51" y="254" font-family="Arial, Helvetica, sans-serif" font-size="68" letter-spacing="-3" fill="#f3f7f0" font-weight="700">Files change.</text>
<text x="51" y="335" font-family="Arial, Helvetica, sans-serif" font-size="68" letter-spacing="-3" fill="#bed7b8" font-weight="700">Flow stays.</text>
<text x="55" y="385" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#a8b9aa">A closer look at ReformANY for Windows.</text>
<text x="56" y="524" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#d7e9d3">▶  PLAY THE TRAILER</text>
<text x="1144" y="524" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2" fill="#9ebaa2">YOUTUBE   /   01:14</text>
