[package]
name = "reformany"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
description = "Independent desktop file conversion application"

[lib]
name = "reformany_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "tga", "qoi", "avif"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"

base64 = "0.22"
qrcodegen = "1.8.0"
tiff = "0.11"
walkdir = "2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate", "aes-crypto"] }
lopdf = "0.38"
sha2 = "0.10"
serde_json = "1"
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"] }
csv = "1.3"
calamine = "0.31"
rust_xlsxwriter = "0.93"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging"
] }
