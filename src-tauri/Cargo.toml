[package]
name = "reformany"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
description = "Independent desktop file conversion application"

[lib]
name = "reformany_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

base64 = "0.22"
tiff = "0.11"
walkdir = "2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate", "aes-crypto"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging"
] }
