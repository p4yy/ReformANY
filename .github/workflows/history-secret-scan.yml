name: History secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Scan full reachable git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action scans only the PR delta by default.
      # Run the scanner directly with --all to cover every fetched ref.
      - name: Scan every fetched branch and Git commit, with redacted logs
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --log-opts="--all" .
