name: Source verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # ReformANY targets Windows. Validate native Rust on the actual target OS.
    # Ubuntu 26.04 mirrors had a DNS outage on 2026-11-11; Linux apt setup
    # prevented the tests from even starting. Do not skip any source checks.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
      - name: Verify offline runtime boundaries
        run: node scripts/audit-offline.mjs
      - name: Prepare checksum-verified local media engines
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/prepare-media-bundle.ps1
      - name: Compile Windows Rust unit tests
        run: cargo test --no-run --manifest-path src-tauri/Cargo.toml
      - name: Run Windows Rust unit tests with Common Controls manifest
        shell: pwsh
        run: ./scripts/run-windows-rust-tests.ps1
      - name: Check Rust lint (all targets, deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
