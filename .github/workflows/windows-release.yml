name: Windows build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Produce test installers only for branches owned by this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      # Tauri's Windows unit test EXEs lack Common Controls v6 by default.
      # Compile, embed the test-only manifest, then run the actual tests.
      - name: Compile Windows Rust tests
        run: cargo test --no-run --manifest-path src-tauri/Cargo.toml
      - name: Run Windows Rust tests with Common Controls manifest
        shell: pwsh
        run: ./scripts/run-windows-rust-tests.ps1
      - name: Build Windows installer
        run: npm run tauri build
      - name: Verify installed Orbit context-menu entries
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (!$installer) { throw "No installer was produced" }
          ./scripts/test-orbit-installer.ps1 -Installer $installer.FullName
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('ReformANY-PR-{0}-Windows-test', github.event.number) || 'ReformANY-0.3.0-Windows-preview' }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
