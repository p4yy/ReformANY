name: Windows build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, design/desktop-orbit-ui-refinement]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Produce test installers only for branches owned by this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      # Stage the real FFmpeg and FFprobe executables BEFORE any Tauri/Rust build.
      # The user-facing setup EXE and runtime operate entirely offline.
      - name: Prepare verified bundled FFmpeg and FFprobe
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/prepare-media-bundle.ps1
      # Tauri's Windows unit test EXEs lack Common Controls v6 by default.
      # Compile, embed the test-only manifest, then run the actual tests.
      - name: Compile Windows Rust tests
        run: cargo test --no-run --manifest-path src-tauri/Cargo.toml
      - name: Run Windows Rust tests with Common Controls manifest
        shell: pwsh
        run: ./scripts/run-windows-rust-tests.ps1
      - name: Build Windows installer
        shell: pwsh
        run: |
          # NSIS is fetched by Tauri during packaging. Retry only the known
          # transient upstream NSIS HTTP 504 failure, never compiler/test errors.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $log = Join-Path $env:RUNNER_TEMP "reformany-tauri-build-$attempt.log"
            & cmd.exe /d /s /c "npm run tauri build > `"$log`" 2>&1"
            $exitCode = $LASTEXITCODE
            Get-Content -LiteralPath $log
            if ($exitCode -eq 0) { break }
            $output = Get-Content -LiteralPath $log -Raw
            if ($attempt -eq 3 -or $output -notmatch '(?is)(NSIS.{0,300}(504|Gateway Timeout)|(504|Gateway Timeout).{0,300}NSIS)') {
              throw "Tauri build failed (exit $exitCode); no further retries."
            }
            Write-Warning "Transient NSIS HTTP 504 on attempt $attempt; retrying in 30 seconds."
            Start-Sleep -Seconds 30
          }
      # Publish a testable EXE as soon as packaging succeeds. Integration
      # tests continue below and may still fail; users must see CI status.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('ReformANY-PR-{0}-Windows-test', github.event.number) || 'ReformANY-0.3.0-Windows-preview' }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # The user-supplied ZIP is the authoritative React design.
      # NSIS continues as a completely silent backend (invoked only with /S).
      - name: Prepare original five-step premium installer UI
        shell: pwsh
        run: |
          $reference = Join-Path $env:RUNNER_TEMP 'ReformANY-Premium-Reference'
          $frontend = Join-Path $PWD 'installer/setup-shell/frontend'
          $overrides = Join-Path $PWD 'installer/setup-shell/frontend-overrides'
          Expand-Archive -LiteralPath 'installer/reference/premium-installer-ui-prompt.zip' -DestinationPath $reference -Force
          New-Item -ItemType Directory -Path $frontend -Force | Out-Null
          Copy-Item -Path (Join-Path $reference '*') -Destination $frontend -Recurse -Force
          Get-ChildItem -LiteralPath $overrides -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($overrides.Length).TrimStart([char]92, [char]47)
            $target = Join-Path $frontend $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $target -Force
          }
          # Remove the reference playground app; only the real installer is shipped.
          Remove-Item -LiteralPath (Join-Path $frontend 'src/App.tsx') -Force
          New-Item -ItemType Directory -Path (Join-Path $frontend 'public') -Force | Out-Null
          Copy-Item 'src-tauri/icons/icon.png' (Join-Path $frontend 'public/brand.png') -Force
          $icons = 'installer/setup-shell/src-tauri/icons'
          New-Item -ItemType Directory -Path $icons -Force | Out-Null
          Copy-Item 'src-tauri/icons/icon.ico' (Join-Path $icons 'icon.ico') -Force
          Copy-Item 'src-tauri/icons/icon.png' (Join-Path $icons 'icon.png') -Force
      - name: Compile actual premium React installer UI
        shell: pwsh
        run: |
          Push-Location 'installer/setup-shell/frontend'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Premium frontend npm install failed' }
            npx tsc --noEmit
            if ($LASTEXITCODE -ne 0) { throw 'Premium frontend TypeScript failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Premium frontend Vite build failed' }
          } finally { Pop-Location }
      - name: Build frameless Windows premium setup executable
        shell: pwsh
        timeout-minutes: 35
        run: |
          $native = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $native) { throw 'No real NSIS engine was built' }
          $env:REFORMANY_NSIS_PAYLOAD = $native.FullName
          cargo build --release --manifest-path 'installer/setup-shell/src-tauri/Cargo.toml'
          if ($LASTEXITCODE -ne 0) { throw 'Premium Tauri setup compilation failed' }
          $premium = 'installer/setup-shell/src-tauri/target/release/reformany-setup.exe'
          if (-not (Test-Path -LiteralPath $premium)) { throw 'Premium setup exe missing' }
          & $premium --verify-payload
          if ($LASTEXITCODE -ne 0) { throw 'Bundled NSIS engine verification failed' }
          Write-Host "Premium installer binary: $premium"
      - name: Upload premium frameless setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('ReformANY-PR-{0}-Premium-Setup', github.event.number) || 'ReformANY-Premium-Setup-preview' }}
          path: installer/setup-shell/src-tauri/target/release/reformany-setup.exe
          if-no-files-found: error
      - name: Verify real NSIS opt-out flags
        shell: pwsh
        run: |
          $native = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $native) { throw 'No real NSIS engine was built' }
          ./scripts/test-setup-flags.ps1 -Installer $native.FullName
      - name: Verify installed Orbit context-menu entries
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (!$installer) { throw "No installer was produced" }
          ./scripts/test-orbit-installer.ps1 -Installer $installer.FullName
      - name: Verify optional FFmpeg install and real transcodes
        timeout-minutes: 12
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (!$installer) { throw "No installer was produced" }
          ./scripts/test-media-installer.ps1 -Installer $installer.FullName
