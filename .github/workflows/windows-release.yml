name: Windows build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      # Windows Tauri 2.12 library test binaries can fail at process startup
      # with 0xc0000139 (TaskDialogIndirect/ComCtl32 v6 manifest is not linked
      # into unit-test executables). Compile tests here; execute all tests
      # through the Linux Source verification job until upstream fixes it.
      - name: Compile Windows Rust tests (Tauri manifest loader workaround)
        run: cargo test --no-run --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('ReformANY-PR-{0}-Windows-test', github.event.number) || 'ReformANY-0.3.0-Windows-preview' }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
