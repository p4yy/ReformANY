name: Windows build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, design/desktop-orbit-ui-refinement]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Produce test installers only for branches owned by this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      # Tauri's Windows unit test EXEs lack Common Controls v6 by default.
      # Compile, embed the test-only manifest, then run the actual tests.
      - name: Compile Windows Rust tests
        run: cargo test --no-run --manifest-path src-tauri/Cargo.toml
      - name: Run Windows Rust tests with Common Controls manifest
        shell: pwsh
        run: ./scripts/run-windows-rust-tests.ps1
      - name: Build Windows installer
        shell: pwsh
        run: |
          # NSIS is fetched by Tauri during packaging. Retry only the known
          # transient upstream NSIS HTTP 504 failure, never compiler/test errors.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $log = Join-Path $env:RUNNER_TEMP "reformany-tauri-build-$attempt.log"
            & cmd.exe /d /s /c "npm run tauri build > `"$log`" 2>&1"
            $exitCode = $LASTEXITCODE
            Get-Content -LiteralPath $log
            if ($exitCode -eq 0) { break }
            $output = Get-Content -LiteralPath $log -Raw
            if ($attempt -eq 3 -or $output -notmatch '(?is)(NSIS.{0,300}(504|Gateway Timeout)|(504|Gateway Timeout).{0,300}NSIS)') {
              throw "Tauri build failed (exit $exitCode); no further retries."
            }
            Write-Warning "Transient NSIS HTTP 504 on attempt $attempt; retrying in 30 seconds."
            Start-Sleep -Seconds 30
          }
      - name: Verify installed Orbit context-menu entries
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (!$installer) { throw "No installer was produced" }
          ./scripts/test-orbit-installer.ps1 -Installer $installer.FullName
      - name: Verify optional FFmpeg install and real transcodes
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (!$installer) { throw "No installer was produced" }
          ./scripts/test-media-installer.ps1 -Installer $installer.FullName
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('ReformANY-PR-{0}-Windows-test', github.event.number) || 'ReformANY-0.3.0-Windows-preview' }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
